spring:
  application:
    name: payflow-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:payflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

app:
  security:
    # Local-development default only. Set JWT_SECRET (32+ bytes) everywhere else.
    jwt-secret: ${JWT_SECRET:local-dev-only-secret-change-me-32-bytes-min}
    token-ttl: PT8H
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
    demo-password: ${DEMO_PASSWORD:demo-pass}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-stacktrace: never
